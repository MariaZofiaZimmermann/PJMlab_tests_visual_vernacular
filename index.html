<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Eksperyment Visual Vernacular</title>

  <!-- jsPsych 6.3.1 -->
  <script src="https://cdn.jsdelivr.net/npm/jspsych@6.3.1/jspsych.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspsych@6.3.1/plugins/jspsych-html-keyboard-response.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspsych@6.3.1/plugins/jspsych-html-button-response.js"></script>

  <link
    href="https://cdn.jsdelivr.net/npm/jspsych@6.3.1/css/jspsych.css"
    rel="stylesheet"
  >

  <style>
    body {
      background-color: #f5f5f5;
    }

    video {
      width: 800px;
      max-width: 90%;
      margin: 0 auto 20px;
      display: block;
    }

    .center {
      text-align: center;
    }

    .big-button {
      font-size: 24px;
      padding: 10px 30px;
      margin-top: 20px;
      cursor: pointer;
    }

    .name-input {
      font-size: 24px;
      padding: 5px 10px;
      width: 300px;
      max-width: 90%;
    }

    .final-text {
      font-size: 32px;
      text-align: center;
      margin-top: 40px;
    }

    .jspsych-btn {
      font-size: 24px !important;
      padding: 10px 25px !important;
      margin: 0 10px !important;
    }
  </style>
</head>

<body></body>

<script>
  /********************************
   * USTAWIENIA
   ********************************/

  let participantCode = "anon";

  const GOOGLE_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbzqjk_Bvi-tolp4leKZCATfFz_RyOyYwY2KQcHBneYqP7A4iG1i4VzyJW2rq42ZM-t30A/exec";

  const timeline = [];

  /********************************
   * 1. KOD UCZESTNIKA
   ********************************/

  timeline.push({
    type: "html-keyboard-response",
    choices: jsPsych.NO_KEYS,

    stimulus: `
      <div class="center">
        <p style="font-size:26px;">
          Proszę wpisać
          <b>KOD OSOBY BADANEJ</b>:
        </p>

        <input
          type="text"
          id="participantCode"
          class="name-input"
        >

        <br><br>

        <button
          id="codeButton"
          class="big-button">
          OK
        </button>
      </div>
    `,

    on_load: function() {
      const input =
        document.getElementById("participantCode");

      const button =
        document.getElementById("codeButton");

      let submitted = false;

      function submitCode() {
        if (submitted) return;
        submitted = true;

        participantCode =
          input.value.trim() || "anon";

        jsPsych.finishTrial({
          participant_code: participantCode
        });
      }

      button.addEventListener(
        "click",
        submitCode
      );

      input.addEventListener(
        "keydown",
        function(e) {
          if (e.key === "Enter") {
            submitCode();
          }
        }
      );

      input.focus();
    },

    on_finish: function() {
      jsPsych.data.addProperties({
        participant_code: participantCode
      });
    }
  });

  /********************************
   * 2. EKRAN START
   ********************************/

  timeline.push({
    type: "html-keyboard-response",
    choices: jsPsych.NO_KEYS,

    stimulus: `
      <div class="center">

        <p style="font-size:28px;">
          Po naciśnięciu START
          rozpoczną się filmiki.
        </p>

        <p style="font-size:22px;">
          Po każdym filmiku proszę
          kliknąć Prawda lub Fałsz.
        </p>

        <button
          id="startButton"
          class="big-button">
          START
        </button>

      </div>
    `,

    on_load: function() {
      document.getElementById("startButton")
        .addEventListener("click", function() {
          jsPsych.finishTrial();
        });
    }
  });

  /********************************
   * 3. LISTA 22 FILMÓW
   ********************************/

  const clips = [
    { file: "12.mp4", correct: "false" },
    { file: "3.mp4", correct: "true" },
    { file: "19.mp4", correct: "true" },
    { file: "7.mp4", correct: "true" },
    { file: "14.mp4", correct: "false" },
    { file: "1.mp4", correct: "true" },
    { file: "21.mp4", correct: "false" },
    { file: "5.mp4", correct: "true" },
    { file: "10.mp4", correct: "true" },
    { file: "17.mp4", correct: "false" },
    { file: "8.mp4", correct: "true" },
    { file: "22.mp4", correct: "false" },
    { file: "6.mp4", correct: "false" },
    { file: "11.mp4", correct: "false" },
    { file: "2.mp4", correct: "true" },
    { file: "15.mp4", correct: "false" },
    { file: "9.mp4", correct: "true" },
    { file: "4.mp4", correct: "true" },
    { file: "16.mp4", correct: "false" },
    { file: "18.mp4", correct: "false" },
    { file: "20.mp4", correct: "true" },
    { file: "13.mp4", correct: "false" }
  ];

  /********************************
   * 4. PRÓBY EKSPERYMENTALNE
   ********************************/

  clips.forEach(function(clip, index) {

    timeline.push({
      type: "html-button-response",

      trial_duration: null,
      response_ends_trial: true,

      stimulus: `
        <div class="center">
          <video autoplay muted playsinline>
            <source
              src="${clip.file}"
              type="video/mp4">

            Twoja przeglądarka
            nie obsługuje wideo.
          </video>
        </div>
      `,

      choices: ["Prawda", "Fałsz"],

      data: {
        clip_number: index + 1,
        file: clip.file,
        correct_answer: clip.correct
      },

      on_finish: function(data) {

        // jsPsych 6.3.1 może używać
        // pola response lub button_pressed.

        const pressed =
          data.response !== undefined &&
          data.response !== null
            ? data.response
            : data.button_pressed;

        const buttonNumber = Number(pressed);

        // 0 = Prawda
        // 1 = Fałsz
        if (buttonNumber === 0) {
          data.response_label = "true";
        } else if (buttonNumber === 1) {
          data.response_label = "false";
        } else {
          data.response_label = null;
        }

        data.button_number =
          pressed !== undefined &&
          pressed !== null &&
          pressed !== "" &&
          Number.isFinite(buttonNumber)
            ? buttonNumber
            : null;

        data.correct =
          data.response_label === null
            ? null
            : data.response_label ===
              data.correct_answer;
      }
    });

  });

  /********************************
   * 5. EKRAN KOŃCOWY
   ********************************/

  timeline.push({
    type: "html-keyboard-response",
    choices: jsPsych.NO_KEYS,
    trial_duration: 3000,

    stimulus: `
      <div class="final-text">
        Dziękujemy za udział!
        <br>
        KONIEC
      </div>
    `
  });

  /********************************
   * 6. ZAPIS WYNIKÓW
   ********************************/

  function saveResults() {

    const trials = jsPsych.data.get()
      .filter({
        trial_type: "html-button-response"
      })
      .values();

    const responses = trials.map(
      function(t, index) {

        return {
          clip_number: index + 1,
          file: t.file,
          button_number: t.button_number,
          response_label: t.response_label,
          correct_answer: t.correct_answer,
          correct: t.correct,
          rt: t.rt
        };

      }
    );

    const payload = {
      participant_id: participantCode,
      responses: responses
    };

    /********************************
     * WYSYŁANIE DO GOOGLE SHEETS
     ********************************/

    fetch(GOOGLE_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",

      headers: {
        "Content-Type": "text/plain"
      },

      body: JSON.stringify(payload),
      keepalive: true
    })
    .then(function() {
      console.log(
        "Żądanie wysłania danych wykonane."
      );
    })
    .catch(function(error) {
      console.error(
        "Błąd wysyłania:",
        error
      );
    });

    /********************************
     * ZAPASOWY PLIK TSV
     ********************************/

    let tsv =
      "participant\tclip_number\tmovie_clip" +
      "\tresponse\tcorrect_answer" +
      "\tcorrect\trt_ms\n";

    responses.forEach(function(t) {

      tsv += [
        participantCode,
        t.clip_number,
        t.file,
        t.response_label,
        t.correct_answer,
        t.correct,
        t.rt
      ].join("\t") + "\n";

    });

    const blob = new Blob(
      [tsv],
      {
        type:
          "text/tab-separated-values;charset=utf-8"
      }
    );

    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");

    a.href = url;
    a.download =
      "dane_" + participantCode + ".tsv";

    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    setTimeout(function() {
      URL.revokeObjectURL(url);
    }, 1000);
  }

  /********************************
   * 7. URUCHOMIENIE
   ********************************/

  jsPsych.init({
    timeline: timeline,

    on_finish: function() {
      saveResults();
    }
  });

</script>
</html>
