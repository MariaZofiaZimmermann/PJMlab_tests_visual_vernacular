<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eksperyment – 22 klipy P/F</title>

  <!-- jsPsych 6.3.1 -->
  <script src="https://cdn.jsdelivr.net/npm/jspsych@6.3.1/jspsych.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspsych@6.3.1/plugins/jspsych-html-keyboard-response.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspsych@6.3.1/plugins/jspsych-html-button-response.js"></script>

  <link
    href="https://cdn.jsdelivr.net/npm/jspsych@6.3.1/css/jspsych.css"
    rel="stylesheet"
  />

  <style>
    body {
      background-color: #f5f5f5;
    }

    video {
      width: 800px;
      max-width: 90%;
      margin-bottom: 20px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    .center {
      text-align: center;
    }

    .big-button {
      font-size: 24px;
      padding: 10px 30px;
      margin-top: 20px;
      cursor: pointer;
    }

    .name-input {
      font-size: 24px;
      padding: 5px 10px;
      width: 300px;
      max-width: 90%;
    }

    .final-text {
      font-size: 40px;
      text-align: center;
      margin-top: 40px;
    }

    .jspsych-btn {
      font-size: 24px !important;
      padding: 10px 25px !important;
      margin: 0 10px !important;
    }
  </style>
</head>

<body></body>

<script>
  /*********************************
   * 0) Ustawienia
   *********************************/

  let participantCode = "anon";

  const GOOGLE_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbwAuU2w_1Fs-UdVSIXYpujZloANhhItRRdNtnum3UVrFi9E9OGTxQrmlDvqtPiH2MPTyg/exec";

  const timeline = [];

  /*********************************
   * 1) Kod osoby badanej
   *********************************/

  timeline.push({
    type: 'html-keyboard-response',
    choices: jsPsych.NO_KEYS,

    stimulus: `
      <div class="center">
        <p style="font-size:26px;">
          Proszę wpisać <b>KOD OSOBY BADANEJ</b>:
        </p>

        <input
          type="text"
          id="participantCode"
          class="name-input"
        />

        <br><br>

        <button
          id="codeButton"
          class="big-button">
          OK
        </button>
      </div>
    `,

    on_load: function() {
      const button = document.getElementById('codeButton');
      const input = document.getElementById('participantCode');

      function submitCode() {
        participantCode = input.value.trim() || "anon";

        jsPsych.finishTrial({
          participant_code: participantCode
        });
      }

      button.addEventListener('click', submitCode);

      input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          submitCode();
        }
      });

      input.focus();
    },

    on_finish: function(data) {
      jsPsych.data.addProperties({
        participant_code: participantCode
      });
    }
  });

  /*********************************
   * 2) Ekran START
   *********************************/

  timeline.push({
    type: 'html-keyboard-response',
    choices: jsPsych.NO_KEYS,

    stimulus: `
      <div class="center">

        <p style="font-size:28px;">
          Po naciśnięciu START rozpoczną się filmiki.
        </p>

        <p style="font-size:22px;">
          Po każdym filmiku proszę kliknąć:
          Prawda lub Fałsz.
        </p>

        <button
          class="big-button"
          onclick="jsPsych.finishTrial()">
          START
        </button>

      </div>
    `
  });

  /*********************************
   * 3) Lista 22 klipów
   *********************************/

  const clips = [
    { file: "12.mp4", correct: "false" },
    { file: "3.mp4",  correct: "true" },
    { file: "19.mp4", correct: "true" },
    { file: "7.mp4",  correct: "true" },
    { file: "14.mp4", correct: "false" },
    { file: "1.mp4",  correct: "true" },
    { file: "21.mp4", correct: "false" },
    { file: "5.mp4",  correct: "true" },
    { file: "10.mp4", correct: "true" },
    { file: "17.mp4", correct: "false" },
    { file: "8.mp4",  correct: "true" },
    { file: "22.mp4", correct: "false" },
    { file: "6.mp4",  correct: "false" },
    { file: "11.mp4", correct: "false" },
    { file: "2.mp4",  correct: "true" },
    { file: "15.mp4", correct: "false" },
    { file: "9.mp4",  correct: "true" },
    { file: "4.mp4",  correct: "true" },
    { file: "16.mp4", correct: "false" },
    { file: "18.mp4", correct: "false" },
    { file: "20.mp4", correct: "true" },
    { file: "13.mp4", correct: "false" }
  ];

  /*********************************
   * 4) Próby eksperymentalne
   *********************************/

  clips.forEach((clip, idx) => {

    timeline.push({
      type: 'html-button-response',

      trial_duration: null,
      response_ends_trial: true,

      stimulus: `
        <div class="center">

          <video autoplay muted playsinline>
            <source
              src="${clip.file}"
              type="video/mp4">

            Twoja przeglądarka nie obsługuje wideo.
          </video>

        </div>
      `,

      choices: ['Prawda', 'Fałsz'],

      data: {
        clip_number: idx + 1,
        file: clip.file,
        correct_answer: clip.correct
      },

      on_finish: function(data) {

        // jsPsych 6: 0 = Prawda, 1 = Fałsz
        data.response_label =
          Number(data.button_pressed) === 0
            ? "true"
            : "false";

        data.correct =
          data.response_label === data.correct_answer;
      }
    });

  });

  /*********************************
   * 5) Ekran końcowy
   *********************************/

  timeline.push({
    type: 'html-keyboard-response',
    choices: jsPsych.NO_KEYS,
    trial_duration: 3000,

    stimulus: `
      <div class="final-text">
        Dziękujemy!
        <br>
        KONIEC
      </div>
    `
  });

  /*********************************
   * 6) Zapisywanie wyników
   *********************************/

  function saveResults() {

    // Pobierz wszystkie 22 próby
    const trials = jsPsych.data.get()
      .filter({
        trial_type: "html-button-response"
      })
      .values();

    // Wyślij tylko potrzebne zmienne
    const responses = trials.map(function(t, index) {
      return {
        clip_number: index + 1,
        file: t.file,
        button_pressed: t.button_pressed,
        response_label: t.response_label,
        correct_answer: t.correct_answer,
        correct: t.correct,
        rt: t.rt
      };
    });

    const payload = {
      participant_id: participantCode,
      responses: responses
    };

    // Wyślij wyniki do Google Sheets
    fetch(GOOGLE_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "text/plain"
      },
      body: JSON.stringify(payload),
      keepalive: true
    })
    .then(function() {
      console.log(
        "Żądanie wysłania wyników zostało wykonane."
      );
    })
    .catch(function(error) {
      console.error(
        "Błąd wysyłania wyników:",
        error
      );
    });

    /*********************************
     * 7) Zapasowy plik TSV
     *********************************/

    let tsv =
      "movie_clip\tresponse\tcorrect\trt_ms\n";

    responses.forEach(function(t) {
      tsv += [
        t.file,
        t.response_label,
        t.correct,
        t.rt
      ].join("\t") + "\n";
    });

    const blob = new Blob(
      [tsv],
      {
        type: "text/tab-separated-values;charset=utf-8"
      }
    );

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");

    a.href = url;
    a.download = "dane_" + participantCode + ".tsv";

    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    setTimeout(function() {
      URL.revokeObjectURL(url);
    }, 1000);
  }

  /*********************************
   * 8) Uruchom eksperyment
   *********************************/

  jsPsych.init({
    timeline: timeline,

    on_finish: function() {
      saveResults();
    }
  });

</script>
</html>
